# fleet.yaml — one per GitHub org, at the org folder root (the directory
# above the org's repos). Not checked into git: placement is
# machine-local, and cwd: entries below are relative to this folder.
#
# This file is SERVER CONFIG PLUS DISPATCH. The work is not in it: the
# tracker says which milestones have jobs, and `flywheel server` starts
# one loop process per milestone that does.
#
# The fleet's agents run in the herdr session named here (default: this
# folder's name, with any `github_` prefix dropped). Start it once with
# `herdr --session <name>`; it persists.
#
# Server config, top-level (FULL-LINE comments only — a `#` inside a
# value is part of the value):
#   session   — the herdr session the fleet's agents run in
#   tracker   — `org/repo`, the org's tracker; the server reads no other
#   project   — the org Project whose Status lane carries the approval
#               (default: Flywheel)
#   loops_cwd — the checkout the loop processes run in, relative to this
#               folder; the repo holding openspec/changes/
#   parallel  — batches a bolt loop drives concurrently (default 4).
#               Merges stay serial regardless; 1 is the strictly
#               serial drive.

session: myorg
tracker: myorg/my-tracker-repo
loops_cwd: my-coordination-repo/main

hosts:
  workstation:
    hostname: my-machine
    default: true

# Optional. A board Team routes its milestone's loop to a host, so a
# server takes only the loops that map to it. Work with no team, or a
# team no host claims, runs wherever the server sees it.
#
# teams:
#   Platform: workstation

# Credentials — the org's own GitHub App, inherited by EVERY actor the
# manifest launches: the server exports these into its environment (so
# the loop processes and in-process tracker calls resolve them), and
# writes them to ~/.config/flywheel/orgs/<org>.env, which
# `flywheel-token --org <org>` sources — so a session in any worktree
# mints the right org's token with zero env plumbing. Keys:
#   FLYWHEEL_GH_APP_ID  — the GitHub App's id
#   FLYWHEEL_GH_APP_KEY — the app's .pem: a path (relative resolves
#                         against this folder) or op:<vault>/<item>
#   FLYWHEEL_GH_ORG     — optional; defaults to the tracker's org
#
# credentials:
#   FLYWHEEL_GH_APP_ID: 4562912
#   FLYWHEEL_GH_APP_KEY: op:MyVault/myorg-flywheel-app.pem

# Dispatch — the org's one standing agent, started by `flywheel dispatch`
# (never by `flywheel up`; the server reaches it through the plugin's
# dispatch MCP server). Keys:
#   host     — optional; pins dispatch to one hosts: entry, so the
#              command run elsewhere refuses and names the owner
#              (reachable via herdr remote). Absent, dispatch runs
#              wherever `flywheel dispatch` is invoked.
#   model    — optional launch model override
#   channels — optional; passed to claude as --channels, which is what
#              connects the Discord bridge
#   env      — optional environment for the launched session, passed
#              verbatim. One key is special: DISCORD_STATE_DIR — absent
#              or relative it resolves against this folder, defaulting
#              to <this folder>/.flywheel/discord — the org-scoped bot
#              token and allowlist, kept apart from any personal
#              machine-level bot.
#   prompt   — the first prompt, sent as its own message rather than
#              folded into a longer one, which is what makes a slash
#              command in it load

dispatch:
  model: opus[1m]
  channels: plugin:discord@claude-plugins-official
  prompt: "You are dispatch for the <org> org; the tracker is <org>/<tracker-repo>. Report your state, then wait for input."
