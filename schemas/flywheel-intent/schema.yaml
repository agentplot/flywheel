name: flywheel-intent
version: 4
description: Flywheel outer loop - one change per intent; decisions, questions
  and session records in git; work items, their states and the
  release queue on the org's tracker
artifacts:
  - id: intent
    generates: intent.md
    description: The intent - destination, scope, and context map references
    template: intent.md
    instruction: |
      You are writing the intent record for a flywheel outer-loop change.

      The intent loop process (`flywheel-intent-loop --slug <slug>`) is
      the sole writer of this change's artifacts. Work items live on the org's
      tracker under the milestone `intent/<slug>` - anyone may queue an
      item or comment there; the operator's own word is applied directly
      by whoever holds it, with a comment recording the change.

      **Input:** The operator's raw intent - a sentence, bullets, or a document.

      **Output:** intent.md with exactly these sections:
      1. **Destination** - the end state in destination voice (what is true when
         this intent is fully realized). Cite the book chapters it touches.
      2. **Map** - the context-map nodes this intent moves, as
         `system-context-map.html#map=target&sel=<node-id>` links, with each
         node's current status (settled / candidate / open).
      3. **Scope** - what is in scope; what is explicitly out.

      THREE SECTIONS. Questions are their own artifacts, discoverable as
      records and tracked as items; intent.md carries no list of them,
      because a copied list is the copy that goes stale. What intent.md
      holds is what does not change as questions close.

      Never invent scope the operator did not state or clearly imply.
    requires: []
  - id: decisions
    generates: decisions/**/*.md
    description: One record per decision closed - the durable outcome of design work
    template: decisions/decision.md
    instruction: |
      You are recording a closed decision for a flywheel intent.

      Create one `decisions/<slug>.md` per decision. Each record contains:
      - **Decision** - one paragraph, declarative, destination voice.
      - **Context** - the map node(s), book chapter(s), and what produced it:
        the session directory and its report, a prototype note, or the
        exchange where the operator gave the word.
      - **Consequences** - what this decision opens: writeback items and
        new questions (queue each as a tracker item), and construction
        work, which is named here and reaches the tracker only as a bolt
        plan card - the planner's or a session's - never as its own item.

      A decision closes on the operator's word, wherever that word is given.
      A decision closed in conversation is not a lesser one; the record is
      written either way, when the decision closes and never before.

      ONE ANSWER PER RECORD. When a decision moves, rewrite every statement
      of it in that record, not only the section being amended, and state
      each enumeration once, in one place, marked as the one to copy. A
      record is authoritative on its decision only if it says one thing.
      Where a record must keep a superseded reading, it says so in the
      sentence that holds it.

      A record is authoritative on its decision and provisional on its
      measurements: give every measurement the tree it was taken on, and
      expect a reader to re-run it.

      Rejected options do not appear - the books hold destinations, git holds
      history.
    requires:
      - intent
  - id: questions
    generates: questions/**/*.md
    description: One record per open question - the prose; its state lives on
      the tracker item created with it
    template: questions/question.md
    instruction: |
      You are recording an open question for a flywheel intent.

      A question gets two things at birth: this record for the prose, and
      a tracker item (label `state:queued`, milestone `intent/<slug>`) for
      the state - a question without an item is untrackable. The record
      holds:
      - **Item** - the tracker item's number.
      - **Raised by** - the session, review, bolt report, or the operator.
      - **The question** - stated so an answer would be recognizable as one.
      - **What turns on it** - what changes each way. If nothing changes,
        there is no question worth recording.
      - **What is already known** - measurements taken, options ruled out,
        adjacent decisions that constrain it. Cite; do not restate.

      What the question blocks is declared on the item as a dependency,
      not written here.

      A question closes by producing a decision record: write
      `decisions/<slug>.md`, add the pointer here, close the item
      `closed:done`. A question overtaken by events closes `closed:superseded`
      with a comment saying what overtook it. The record stays - it is how
      a later reader learns the decision had a question behind it.
    requires:
      - intent
  - id: sessions
    generates: sessions/**/*
    description: Design session directories - one per session, the working record
      the loop promotes from
    template: sessions/README.md
    instruction: |
      You are opening or closing a tracked design session for a flywheel intent.

      The intent loop launches every design session, names its type in
      the work order, and assigns it a directory under the change:
      `sessions/<YYYY-MM-DD>-<slug>/`. The date is the day the session is
      charged; the slug names the batch of work, not its outcome. The
      session is the sole writer inside its directory.

      A work order is the change id, the session type, the item numbers of
      its batch, and one or two plain sentences of goal. Worktree, model
      and directory are launch mechanics, not work order content.

      Each directory opens with `README.md`: the work order, what the
      session produced (reports, decision drafts, prototype notes - all
      real committed files, here and nowhere else), and what it delivered.
      A session that ends with a round-close plan writes it under
      `close/` in this directory - `plan.html` (the surface),
      `elaboration.md`, `bolt-summary.md`, `units/<slug>.md` - per the
      plugin's `skills/_reference/round-close.md`; the page renders the
      markdown files, and the apply posts them verbatim.
      The session comments each item it worked; the loop merges the
      session's branch and closes items on the evidence, once the
      OPERATOR has marked the session done on the tracker. Completion is
      never inferred from a round artifact - a plannotator or lavish
      round, or a round-close plan, may be worked as many times as the
      operator wants.

      A closed session directory is never rewritten - it is the trail. When
      later work revises what a session decided, the decision record moves;
      the session's record of having decided it stands.
    requires:
      - intent
  - id: prototypes
    generates: prototypes/**/*.md
    description: Prototype findings - what each throwaway proved; code stays in the spike repo
    template: prototypes/prototype.md
    instruction: |
      You are recording what a prototype proved for a flywheel intent.

      Create one `prototypes/<slug>.md` per prototype. Each note contains:
      - **Question** - what the prototype set out to prove or disprove.
      - **Where** - the spike-repo path or branch holding the throwaway code.
      - **Findings** - what was proven, plainly. Negative results are findings.
      - **Feeds** - the decision(s) this evidence feeds.

      The code never moves with the note - prototypes prove decisions and die.
      The commissioning item gets the finding as its closing comment.
    requires:
      - intent
apply:
  requires:
    - intent
  instruction: |
    Loop for the intent <slug>. State lives on the tracker; you hold
    none. The loop runs as the plugin's own process -
    <plugin-root>/bin/flywheel-intent-loop --slug <slug> - started by
    the server when the milestone has a job, or by hand. This
    instruction is the loop's contract: the process and its tests
    implement it, and editing this instruction is how the loop
    changes.

    INPUT, each cycle, read fresh from the tracker (fields as in
    <plugin-root>/workflows/fixtures/intent-tracker.json): the
    milestone intent/<slug>'s open items - number, title, type label,
    state label, blocked_by issue numbers (GitHub's dependency edges,
    read from the API, never inferred), parent batch, record path -
    and this milestone's units and elaborations with their board
    Status. When launched with a fixture snapshot instead of the live
    tracker (an isolated run): read state from the snapshot, write
    nothing to the tracker, and collect every would-be tracker write
    and pane event into a trace array in the run report.

    One hard rule on the run itself: a cycle that cannot read
    the tracker, mint its token, or resolve its parameters STOPS THE
    RUN with the failure in the report; a failing cycle never loops.

    THE LOOP OWNS ALL WAITING. A session is driven by small steps
    that each return exactly once, with the loop's own arithmetic as
    the clock: LAUNCH (idempotent - a session already running under
    the name is reused, never duplicated; create pane, start, rename
    and confirm, deliver the one-prompt order, verify it went
    working, return without waiting); WAIT - each
    wait runs one bounded herdr agent wait (a single
    invocation, at most ~10 minutes) and reports settled, blocked,
    or still working; the LOOP counts the chunks and applies the
    limits; then READ AND CLOSE (pane report out - ghost text is not
    input - tab closed, outcome returned). No step parks a monitor,
    returns a placeholder, or counts time. A blocking operator round
    - plannotator, a lavish page - takes the same shape: launched
    once with a result file, waited on by the loop.

    GUARDS - checked EVERY cycle, in this order; each is idempotent.
    A guard records only the WRITES it makes - a check that changed
    nothing records nothing, or the loop never quiets:

    0. No change dir at openspec/changes/<slug>: scaffold it
       (/opsx:new <slug>, bind flywheel-intent), commit, continue.
    1. A batch at Ready with state:queued sub-issues: relabel them
       state:ready. The flip is spent; the labels carry the release.
    2. COMPOSE: any state:queued design item with no parent batch ->
       group the orphans into proposed batches (flywheel-batch) at
       Backlog, by thread. Composing is not releasing; batches wait
       for the operator. Construction work is never an intent item:
       it is born as bolt plan cards - the planner's or a session's -
       and released by the operator's approval.

    MODELS - explicit in every session launch; nothing inherits
    silently. Sessions
    take their type's model at agent start (--model): planning and
    interactive fable; research opus[1m]; prototype and writeback
    opus; the merge stage sonnet.

    LIMITS, by session type, in 10-minute wait chunks: research,
    prototype and writeback sessions - after 90 minutes of real
    waiting (a chunk counts only when its wait ran the full 10
    minutes) the driver comments the wait on the batch's first item and adds
    needs-operator (a live wait; dispatch relays), then KEEPS
    waiting; after 4 hours it returns stalled and leaves the pane
    open. Planning and interactive sessions hold operator
    rounds by design: the driver notifies at 90 minutes the same way
    but never returns them stalled.

    WORK - while any item is state:ready:

      batch the ready items by their type label - one session type
      per batch, prototypes always alone. A batch runs only when
      every blocked_by of every item in it is closed - computed from
      the field, not reasoned.

      for each unblocked batch, in parallel: one session in a herdr
      pane (a session that edits files or may need the operator
      always gets a pane; pure read-and-report may run in-process).
      The work order is ONE prompt: the type's invocation first line,
      the item numbers and goal below. Flip its items
      state:in-progress at start; wait; read the report; close the
      pane.

      on each finished session: merge its branch through the gate -
      the merge driver runs in the repo's main checkout; a work
      session gets a fresh sess/* worktree, a merge stage never
      does.
      The session wrote its own records (decisions, questions, its
      session directory) and queued its own discoveries - whoever
      finds queues; you create only batches. You merge, and you
      close finished items closed:done on the evidence.

      then re-run the guards and re-query.

    STOP when no item is state:ready and the guards changed nothing:
    report the queue - one line per batch and unbatched item - and
    the run ID. An empty ready set with a full queue is the correct
    resting state.

    Tracker writes run as the app (GH_TOKEN via
    <plugin-root>/bin/flywheel-token; if the token cannot mint, stop
    - never ambient credentials). Invocations:
    skills/_reference/herdr.md.

    THE ANDON CORD - a session that finds the work has gone wrong in
    a way no further round will fix stops, holds its batch, and asks
    the operator. Stopping on a defect is expected behaviour.
