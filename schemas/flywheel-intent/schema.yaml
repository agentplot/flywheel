name: flywheel-intent
version: 2
description: Flywheel outer loop - one change per intent; decisions, questions,
  assertions and session records in git; work items, their states and the
  release queue on the org's tracker
artifacts:
  - id: intent
    generates: intent.md
    description: The intent - destination, scope, and context map references
    template: intent.md
    instruction: |
      You are writing the intent record for a flywheel outer-loop change.

      The intent conductor (herdr agent `intent-<slug>`) is the sole
      writer of this change's artifacts. Work items live on the org's
      tracker under the milestone `intent/<slug>` - anyone may queue an
      item or comment there; the operator's own word is applied directly
      by whoever holds it, with a comment recording the change.

      **Input:** The operator's raw intent - a sentence, bullets, or a document.

      **Output:** intent.md with exactly these sections:
      1. **Destination** - the end state in destination voice (what is true when
         this intent is fully realized). Cite the book chapters it touches.
      2. **Map** - the context-map nodes this intent moves, as
         `system-context-map.html#map=target&sel=<node-id>` links, with each
         node's current status (settled / candidate / open).
      3. **Scope** - what is in scope; what is explicitly out.

      THREE SECTIONS. Questions and assertions are their own artifacts,
      discoverable as records and tracked as items; intent.md carries no
      list of either, because a copied list is the copy that goes stale.
      What intent.md holds is what does not change as questions close.

      Never invent scope the operator did not state or clearly imply.
    requires: []
  - id: decisions
    generates: decisions/**/*.md
    description: One record per decision closed - the durable outcome of design work
    template: decisions/decision.md
    instruction: |
      You are recording a closed decision for a flywheel intent.

      Create one `decisions/<slug>.md` per decision. Each record contains:
      - **Decision** - one paragraph, declarative, destination voice.
      - **Context** - the map node(s), book chapter(s), and what produced it:
        the session directory and its report, a prototype note, or the
        exchange where the operator gave the word.
      - **Consequences** - what this decision opens: writeback items,
        assertions, new questions. Queue each as a tracker item.

      A decision closes on the operator's word, wherever that word is given.
      A decision closed in conversation is not a lesser one; the record is
      written either way, when the decision closes and never before.

      ONE ANSWER PER RECORD. When a decision moves, rewrite every statement
      of it in that record, not only the section being amended, and state
      each enumeration once, in one place, marked as the one to copy. A
      record is authoritative on its decision only if it says one thing.
      Where a record must keep a superseded reading, it says so in the
      sentence that holds it.

      A record is authoritative on its decision and provisional on its
      measurements: give every measurement the tree it was taken on, and
      expect a reader to re-run it.

      Rejected options do not appear - the books hold destinations, git holds
      history.
    requires:
      - intent
  - id: questions
    generates: questions/**/*.md
    description: One record per open question - the prose; its state lives on
      the tracker item created with it
    template: questions/question.md
    instruction: |
      You are recording an open question for a flywheel intent.

      A question gets two things at birth: this record for the prose, and
      a tracker item (label `state:queued`, milestone `intent/<slug>`) for
      the state - a question without an item is untrackable. The record
      holds:
      - **Item** - the tracker item's number.
      - **Raised by** - the session, review, bolt report, or the operator.
      - **The question** - stated so an answer would be recognizable as one.
      - **What turns on it** - what changes each way. If nothing changes,
        there is no question worth recording.
      - **What is already known** - measurements taken, options ruled out,
        adjacent decisions that constrain it. Cite; do not restate.

      What the question blocks is declared on the item as a dependency,
      not written here.

      A question closes by producing a decision record: write
      `decisions/<slug>.md`, add the pointer here, close the item
      `closed:done`. A question overtaken by events closes `closed:superseded`
      with a comment saying what overtook it. The record stays - it is how
      a later reader learns the decision had a question behind it.
    requires:
      - intent
  - id: assertions
    generates: assertions/**/*.md
    description: One record per assertion - the proposal itself, the durable
      claim of what must be built
    template: assertions/assertion.md
    instruction: |
      You are recording an assertion for a flywheel intent.

      AN ASSERTION IS THE PROPOSAL. It is written the moment the work is
      identified, it is what the operator releases, and it is what a bolt's
      spec agents work from - nothing restates it downstream. Like a
      question it gets two things at birth: this record, and a tracker
      item (labels `type:assertion` + `state:queued`, milestone
      `intent/<slug>`). The record holds:
      - **Repo** - the built repo it lands in.
      - **Item** - the tracker item's number.
      - **Raised by** - the session, review, bolt report, or the operator.
      - **The claim** - what must be true when this is built, written so a
        reader can check it against the tree.
      - **Why** - the defect, measurement, or decision behind it. Cite
        `decisions/<slug>.md` and session reports; do not restate them.
      - **Boundaries** - what it does NOT cover where a reader would assume
        otherwise, naming the sibling that holds the rest.

      Live state - queued, released, whose batch - is the item's alone.
      When the work merges, append the terminal fact here: the change id
      and landing ref, dated. A record asserts nothing that can go stale
      silently.

      State the claim as CONTENT the tree can be checked against, not as
      STATE about a neighbouring artifact, and give every measurement its
      ref. ONE ANSWER PER RECORD: when the claim narrows, rewrite every
      statement of it here rather than appending a correction.
    requires:
      - intent
  - id: sessions
    generates: sessions/**/*
    description: Design session directories - one per session, the working record
      the conductor promotes from
    template: sessions/README.md
    instruction: |
      You are opening or closing a tracked design session for a flywheel intent.

      The intent conductor launches every design session, names its type
      in the work order, and assigns it a directory under the change:
      `sessions/<YYYY-MM-DD>-<slug>/`. The date is the day the session is
      charged; the slug names the batch of work, not its outcome. The
      session is the sole writer inside its directory.

      A work order is the change id, the session type, the item numbers of
      its batch, and one or two plain sentences of goal. Worktree, model
      and directory are launch mechanics, not work order content.

      Each directory opens with `README.md`: the work order, what the
      session produced (reports, decision drafts, prototype notes - all
      real committed files, here and nowhere else), and what it delivered.
      The session comments each item it worked; the conductor merges the
      session's branch and closes items on the evidence.

      A closed session directory is never rewritten - it is the trail. When
      later work revises what a session decided, the decision record moves;
      the session's record of having decided it stands.
    requires:
      - intent
  - id: prototypes
    generates: prototypes/**/*.md
    description: Prototype findings - what each throwaway proved; code stays in the spike repo
    template: prototypes/prototype.md
    instruction: |
      You are recording what a prototype proved for a flywheel intent.

      Create one `prototypes/<slug>.md` per prototype. Each note contains:
      - **Question** - what the prototype set out to prove or disprove.
      - **Where** - the spike-repo path or branch holding the throwaway code.
      - **Findings** - what was proven, plainly. Negative results are findings.
      - **Feeds** - the decision(s) this evidence feeds.

      The code never moves with the note - prototypes prove decisions and die.
      The commissioning item gets the finding as its closing comment.
    requires:
      - intent
apply:
  requires:
    - intent
  instruction: |
    Work the READY set to empty, then stop at the queue.

    This instruction is what the dynamic workflow is built from
    (`/opsx:apply build a dynamic workflow with the instructions for
    <change>`). Two rules govern the run. The workflow IS the
    loop: one run works the ready set to empty - re-query after the merge, bounce handling, and the next
    batch are stages inside the run, never a reason to build another
    workflow - and a fresh run is built only when this conductor is
    prompted again. A second rule binds every stage the workflow
    runs: a WORK stage's agent never does the batch's work itself -
    its job is to drive herdr: start the session the batch names,
    deliver the work order — one prompt, the type's invocation as
    its first line, the brief below — wait on it, return the
    outcome, and close the session's pane (the worktree and branch
    stay for the merge step). The
    operator supervises herdr sessions, and a session that needs the
    operator - a plannotator round, a lavish page, a plan-mode
    approval - can only reach them from a real pane; an in-process
    subagent cannot. Subagents may read and report (QUERY, ANALYSE,
    synthesis); sessions do the work.

    The tracker is the org's, named by the `tracker:` line in the org's
    fleet.yaml; every tracker write runs as the app
    (`GH_TOKEN=$(<plugin-root>/bin/flywheel-token --org <org>)` — the
    plugin's bin/ is not on PATH; your loaded loop skill states the
    root). The invocations are in the
    flywheel plugin's `skills/_reference/herdr.md`.

    1 · QUERY — the milestone `intent/<slug>`'s open items labelled
      `state:ready`, and its batches (units and elaborations) whose
      Project Status the operator has moved to Ready on the board:
      relabel those batches' sub-issues to
      `state:ready` first, then take the whole ready set. The
      tracker is the only source of work.

    2 · ANALYSE — partition the ready set into session batches. Type is
      the hard boundary: a session loads one type skill, so items of
      different types never share a session. Within a type the call is
      judgment, not a formula: related topics share a session, unrelated
      ones split even at the same type, and prototypes ride alone by
      default — each is its own experiment and worktree. Each batch names
      its session type and model (the type's default unless overridden).
      Dependencies are the items' blocked-by relations and order the
      batches. This step reads and writes nothing.

    3 · WORK — one session per batch, parallel where batches are
      disjoint, dependency order where they are not. A session that edits
      files runs isolated in its own worktree; a session that only reads
      and reports gets none. Flip each item to `state:in-progress` when
      its session starts. Batch generously; split for the reasons above,
      never to make sessions smaller.

    4 · MERGE — merge each finished session branch through the gate,
      promote what it delivered (decision records, assertion records,
      writebacks), comment each item with the outcome, and close finished
      items `closed:done`. New work a session surfaced is queued as new
      items - never worked directly from here. Then re-query.

    When the ready set is empty, two moves at the queue, then stop:

    - BIRTH THE HANDOFF when it is due. An assertion is settled and
      unbolted when its item is open on `intent/<slug>` (bolting IS the
      milestone move to `bolt/<slug>`, so the milestone field is the
      test), it has no parent batch, and every item blocking it is
      closed. When any exist, queue one `type:handoff` item naming
      exactly that set - or extend the open unstarted handoff item with
      the newcomers. The handoff session it charges plans the bolt:
      bolt type, owner, sequencing, the milestone move.
    - COMPOSE the queue into proposed batches (`flywheel-batch`) -
      elaborations of design work, units of settled assertions - grouped
      by thread: a prototype, the questions it answers, and the
      writeback of its findings are one approval even though they are
      three types; the type partition happens at session time, not here.

    Present the queue to the operator - one line per batch and unbatched
    item - and stop. An empty ready set with a full queue is the correct
    resting state, not a stall.

    Report the run ID when the loop ends.

    THE ANDON CORD — a session that finds the work has gone wrong in a
    way no further round will fix - the batch builds on a claim just
    disproved, two released items contradict each other - stops, holds
    the batch, and asks the operator. Stopping on a defect is expected
    behaviour.
