name: bolt-default
version: 2
description: Flywheel construction tracking, the default bolt type - one change per
  bolt; the released assertions are its items on the org's tracker; per-repo
  bolt branches; the loop schedules an independent proposal-review, an
  adversarial code-review, and batched acceptance. Picked for normal work
  touching code others read.
artifacts:
  - id: bolt
    generates: bolt.md
    description: The bolt - scope, source intents, involved repos and branches, merge criteria
    template: bolt.md
    instruction: |
      You are writing the bolt record for a flywheel construction change.

      A bolt is one construction iteration: the record for building a batch
      of released assertions across one or more built repos. Its conductor
      (herdr agent `bolt-<slug>`) is the sole writer of this change's
      artifacts. The work items are the released assertions' tracker items,
      moved into the milestone `bolt/<slug>` at release; anyone may queue
      an item or comment there. An item's progress through spec, review,
      build and merge is its comment history; it closes `closed:done` with
      the landing SHA in the closing comment.

      Three edits the bolt conductor makes DIRECTLY, with no item: a
      repo's CLAUDE.md, an architecture decision record (into the built
      repo's log4brains layout - the bolt is where the material for one
      exists), and the loop's own machinery where the change is small and
      self-evident. Everything else the bolt lands is carried by an item.

      **Output:** bolt.md with exactly these sections:
      1. **Scope** - what this bolt builds, in one paragraph.
      2. **Sources** - the intents whose released assertions this bolt
         serves; work folded in later is appended here with dates.
      3. **Repos** - one line per involved built repo: repo · bolt branch
         name (`bolt/<slug>`) · worktree path. Bolt branches live for the
         length of the bolt; construction work runs on nested worktrees
         off them.
      4. **Merge criteria** - what "thorough enough to land on main" means
         for this bolt: the acceptance suites that must be green on the
         bolt branch, review requirements, and any repo-specific gates.
         The full release gate (wt merge with full hooks) is always
         implied and never weakened.

      Two rules bind every section here. State a constraint only as
      strongly as you verified it, naming the tree and the check behind
      it; where you have not verified it, say that plainly instead of
      rounding up, because an agent told to expect a failure that cannot
      happen learns to discount constraints.
      And where a section names something that constrains order, coupling
      or membership, state the fact that makes the constraint CORRECT, not
      the mechanism that makes it stick.
    requires: []
apply:
  requires:
    - bolt
  instruction: |
    Work the READY set to empty, then stop at the queue.

    THE LOOP IS NOT IMPROVISED. It is the plugin's canonical script at
    <plugin-root>/workflows/bolt-default.js - read its header: the
    argument shape and the whole mechanics contract are documented in
    the file. Launch it as ONE run with the Workflow tool
    ({scriptPath: "<plugin-root>/workflows/bolt-default.js", args}),
    and after a correction, a ruling, or an answered pane, RESUME the
    same run ({scriptPath, resumeFromRunId}) - finished stages replay
    from cache. One run lineage per bolt; never a rebuilt workflow,
    never a wave number. "/opsx:apply build a dynamic workflow with
    the instructions for <change>" means exactly: launch that script.

    Your conductor-side work around the run:

    1 - QUERY, before launch: the milestone bolt/<slug>'s open items
      labelled state:ready, plus any unit of this bolt the operator
      has moved to Ready on the board - relabel those units'
      sub-issues to state:ready first. Name each item's spec-driven
      change (one change per assertion) and build the script's args.
    2 - RUN: launch the script. While it runs, do nothing but answer
      what it surfaces - a blocked pane is a permission ask or plan
      dialog: read it, answer one at a time, never by pattern.
    3 - AFTER: the run's report names what finished and what did not.
      Answer open panes, then resume the run. When the report is
      clean and the bolt's merge criteria hold, resume once more with
      args.land: true for the landing pass.
    4 - QUEUE: when the ready set is empty, compose this bolt's
      state:queued items into a unit at Backlog (a discovery rides
      this bolt only if the bolt cannot land without it; otherwise it
      goes to the intent that owns its subject, or unmilestoned for
      dispatch), present the queue one line each, report the run ID,
      and stop. When every item is closed, propose closure: teardown,
      openspec archive - the operator's milestone close is the
      archive signal.

    This bolt type is STRIPPED while the mechanics are pinned: no
    review steps are scheduled. The merge gate still runs unweakened
    at every landing; reviews return to this schema once the loop
    mechanics are settled. One-prompt work orders,
    delivery-is-settling, and pane-close-at-merge are stated in the
    script and in skills/_reference/herdr.md; the tracker rules are
    the shared copy at skills/_reference/tracker.md.

    THE ANDON CORD - a session that finds the work has gone wrong in
    a way no further round will fix - the spec contradicts the
    decision it cites, the tree contradicts the spec - stops, holds
    the batch, and asks the operator. Stopping on a defect is
    expected behaviour.
